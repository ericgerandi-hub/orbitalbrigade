name: Spieler-Statistik
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zahlen:
    runs-on: ubuntu-latest
    steps:
      - name: Zaehler abfragen
        run: |
          B=https://abacus.jasoncameron.dev
          NS=orbitalbrigade-eg
          HEUTE=$(TZ=Europe/Berlin date +%F)
          g(){ v=$(curl -s -m 15 "$B/get/$NS/$1" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",0))' 2>/dev/null); echo "${v:-0}"; }
          echo "::notice title=OBSTAT::OBSTAT datum=$HEUTE installs_gesamt=$(g installs) installs_heute=$(g installs-$HEUTE) spieler_heute=$(g spieler-$HEUTE) runden_heute=$(g runden-$HEUTE) neue_geraete_heute=$(g geraete-$HEUTE) geraete_gesamt=$(g geraete)"
